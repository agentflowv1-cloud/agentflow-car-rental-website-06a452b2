<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Car Information Cards</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css' />
</head>
<body>
    <div class='container mx-auto p-4 pt-6 lg:p-12 lg:pt-20'>
        <div class='grid grid-cols-1 md:grid-cols-3 gap-4'>
            <div class='bg-white rounded-lg shadow-md p-4'>
                <img src='https://source.unsplash.com/200x200/?car,audi' alt='Audi Car' class='w-full h-48 object-cover mb-4'>
                <h2 class='text-lg font-bold mb-2'>Audi A4</h2>
                <p class='text-gray-600'>Price: $30,000</p>
            </div>
            <div class='bg-white rounded-lg shadow-md p-4'>
                <img src='https://source.unsplash.com/200x200/?car,bmw' alt='BMW Car' class='w-full h-48 object-cover mb-4'>
                <h2 class='text-lg font-bold mb-2'>BMW 3 Series</h2>
                <p class='text-gray-600'>Price: $40,000</p>
            </div>
            <div class='bg-white rounded-lg shadow-md p-4'>
                <img src='https://source.unsplash.com/200x200/?car,mercedes' alt='Mercedes Car' class='w-full h-48 object-cover mb-4'>
                <h2 class='text-lg font-bold mb-2'>Mercedes-Benz C-Class</h2>
                <p class='text-gray-600'>Price: $50,000</p>
            </div>
        </div>
    </div>
</body>
</html>
